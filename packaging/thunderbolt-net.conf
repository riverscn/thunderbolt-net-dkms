# Installed by thunderbolt-net-dkms as /usr/lib/modprobe.d/thunderbolt-net.conf
# and removed with the package. It enables the macOS TSO receive workaround
# (rx_segment, rx_segment_mtu) and RX page recycling (rx_page_pool).
#
# To change these defaults, copy this file to
# /etc/modprobe.d/thunderbolt-net.conf and edit the copy; a file of the same
# name in /etc replaces this one. Files whose names sort before
# "thunderbolt-net.conf" do not override it. Changes apply on the next
# module load; see docs/installation.md.
#
# rx_segment_mtu is the fallback path MTU: the IP length of the segments
# rebuilt from a peer's TCP aggregate when nothing has been learned for the
# flow (rx_segment_learn reads the SYN-ACK and ICMP that pass toward the
# peer). It must not exceed the smallest MTU on any path those flows take
# (PPPoE 1492, tunnels, IPv6 minimum 1280); a larger value stalls uploads.
# Raise it only when every egress path is known to carry larger packets.
options thunderbolt_net rx_segment=1 rx_segment_mtu=1280 rx_page_pool=1
