name: Build and test

"on":
  # Branch work is checked through its pull request (the merge result) or by
  # manual dispatch; pushing feature branches as well would run CI twice.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify sources and release allowlist
        run: make check
      - name: Validate installation-first release notes
        run: python3 scripts/release-notes.py > /dev/null
      - name: Ensure every tracked file is reviewed for release
        run: diff -u release-files.txt <(git ls-files | LC_ALL=C sort)

  linux:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:13', 'ubuntu:26.04']
    container:
      image: ${{ matrix.image }}
      options: --cpus=2 --memory=3g --pids-limit=512
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build deb, run kernel tests, verify DKMS lifecycle
        run: bash scripts/ci-linux.sh
      - name: Save RX lifecycle diagnostics
        if: always() && matrix.image == 'ubuntu:26.04'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rx-model-${{ github.sha }}
          path: |
            build/rx-page-pool/*.log
            build/rx-page-pool/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Export source-only release artifacts
        if: matrix.image == 'ubuntu:24.04'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  upstream-status:
    # Discovery is advisory; release builds always use the reviewed lock file.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare pinned baseline with kernel.org stable
        run: |
          python3 scripts/upstream.py status --output build/upstream-status.json
          cat build/upstream-status.json >> "$GITHUB_STEP_SUMMARY"

  upstream-kernel:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ubuntu:24.04
      options: --cpus=2 --memory=3g --pids-limit=512
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned upstream stable and test DKMS in isolation
        run: bash scripts/ci-upstream.sh
      - name: Save upstream kernel diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-kernel-${{ github.sha }}
          path: |
            build/upstream-kernel/*
            build/qemu-*.log
          if-no-files-found: warn
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [source, linux, upstream-kernel]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: dist
      - name: Publish experimental prerelease after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$(cat VERSION)"
          (cd dist && sha256sum --check SHA256SUMS)
          python3 scripts/release-notes.py --repository "$GH_REPO" > dist/release-notes.md
          gh release create "$TAG" dist/*.deb dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --prerelease --title "$TAG" --notes-file dist/release-notes.md
