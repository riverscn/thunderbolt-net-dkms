PACKAGE_NAME="thunderbolt-net"
PACKAGE_VERSION="0.1.1"
BUILT_MODULE_NAME[0]="thunderbolt_net"
BUILT_MODULE_LOCATION[0]="src"
DEST_MODULE_LOCATION[0]="/kernel/drivers/net/thunderbolt"
AUTOINSTALL="yes"
MAKE[0]="make KERNELRELEASE=${kernelver} KDIR=${kernel_source_dir}"
BUILD_EXCLUSIVE_KERNEL="^(6\.(8|9|1[0-9])|7\.0)([.-]|$)"
BUILD_EXCLUSIVE_ARCH="^x86_64$"
